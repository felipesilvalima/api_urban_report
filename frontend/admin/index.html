<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Report - Login Administrativo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page login-page">
    <main class="card login-card">
      <div class="brand">
        <span class="brand-icon">🏙️</span>
        <span>Urban Report</span>
      </div>
      <p class="subtitle">Painel administrativo de denúncias</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required autocomplete="username" />
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">
          <span id="submit-label">Entrar</span>
          <span id="submit-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <div id="result" class="result error hidden"></div>
    </main>

    <footer class="footer">
      <a href="../public-report/index.html">Fazer uma denúncia</a>
    </footer>
  </div>

  <script src="api.js"></script>
  <script src="login.js"></script>
</body>
</html>
